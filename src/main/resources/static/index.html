<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星河商城 · 售后客服</title>
    <style>
        :root {
            --ink: #0f172a;
            --muted: #64748b;
            --line: #e2e8f0;
            --brand: #1d4ed8;
            --brand-dark: #1e3a8a;
            --teal: #0f766e;
            --warn-bg: #fef3c7;
            --warn-line: #f59e0b;
            --warn-ink: #92400e;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 24px 16px;
            font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
            color: var(--ink);
            background: radial-gradient(circle at 15% 10%, #dbeafe 0, transparent 45%),
                        radial-gradient(circle at 85% 0%, #ccfbf1 0, transparent 40%),
                        #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app {
            width: min(880px, 100%);
            min-width: 0;
            height: calc(100vh - 48px);
            min-height: 560px;
            background: #fff;
            border: 1px solid rgba(148, 163, 184, .28);
            border-radius: 22px;
            box-shadow: 0 24px 60px rgba(15, 23, 42, .14);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 18px 22px;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 62%, #0f766e 100%);
            color: #fff;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            background: rgba(255, 255, 255, .14);
            border: 1px solid rgba(255, 255, 255, .3);
            display: grid;
            place-items: center;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            flex: none;
        }

        .title-block { flex: 1; min-width: 0; }
        .title-block h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: .3px; }
        .title-block p { margin: 3px 0 0; font-size: 12px; color: rgba(255, 255, 255, .72); }

        .meta-badge {
            font-size: 11px;
            padding: 5px 10px;
            border-radius: 999px;
            background: rgba(255, 255, 255, .13);
            border: 1px solid rgba(255, 255, 255, .22);
            color: rgba(255, 255, 255, .88);
            white-space: nowrap;
            max-width: 260px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .ghost-btn {
            border: 1px solid rgba(255, 255, 255, .32);
            background: transparent;
            color: #fff;
            font-size: 12px;
            padding: 6px 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: background .16s ease;
            white-space: nowrap;
        }
        .ghost-btn:hover { background: rgba(255, 255, 255, .14); }

        .user-select {
            appearance: none;
            border: 1px solid rgba(255, 255, 255, .32);
            background-color: rgba(255, 255, 255, .12);
            color: #fff;
            font-size: 12px;
            padding: 6px 24px 6px 10px;
            border-radius: 10px;
            cursor: pointer;
            outline: none;
            background-image: linear-gradient(45deg, transparent 50%, rgba(255, 255, 255, .7) 50%),
                              linear-gradient(135deg, rgba(255, 255, 255, .7) 50%, transparent 50%);
            background-position: calc(100% - 13px) 50%, calc(100% - 9px) 50%;
            background-size: 4px 4px, 4px 4px;
            background-repeat: no-repeat;
            max-width: 140px;
        }
        .user-select option { color: #0f172a; background: #fff; }

        .human-banner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 11px 20px;
            background: var(--warn-bg);
            border-bottom: 1px solid rgba(245, 158, 11, .38);
            color: var(--warn-ink);
            font-size: 13px;
        }
        .human-banner strong { font-weight: 650; }
        .human-banner .ticket { opacity: .8; margin-left: 8px; }
        .human-banner button {
            border: 1px solid rgba(146, 64, 14, .35);
            background: #fff;
            color: var(--warn-ink);
            font-size: 12px;
            padding: 5px 12px;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
        }
        .human-banner button:hover { background: #fffbeb; }
        .hidden { display: none !important; }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 22px 22px 10px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scroll-behavior: smooth;
        }
        .messages::-webkit-scrollbar { width: 6px; }
        .messages::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

        .msg { display: flex; gap: 10px; max-width: 86%; }
        .msg.user { align-self: flex-end; flex-direction: row-reverse; }
        .msg.assistant { align-self: flex-start; }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            flex: none;
            display: grid;
            place-items: center;
            font-size: 12px;
            font-weight: 700;
            margin-top: 2px;
        }
        .msg.assistant .avatar { background: #e0f2fe; color: #075985; }
        .msg.user .avatar { background: #1d4ed8; color: #fff; }

        .bubble {
            padding: 11px 15px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.65;
            word-break: break-word;
        }
        .msg.assistant .bubble {
            background: #f8fafc;
            border: 1px solid var(--line);
            border-top-left-radius: 5px;
        }
        .msg.user .bubble {
            background: var(--brand);
            color: #fff;
            border-top-right-radius: 5px;
            box-shadow: 0 6px 16px rgba(29, 78, 216, .22);
        }
        .msg.error .bubble {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
        }

        .bubble p { margin: 0 0 6px; }
        .bubble p:last-child { margin-bottom: 0; }
        .bubble ul { margin: 4px 0 6px; padding-left: 20px; }
        .bubble li { margin: 2px 0; }
        .bubble .gap { height: 6px; }
        .bubble strong { font-weight: 650; }

        .notice {
            align-self: center;
            font-size: 12px;
            color: var(--muted);
            background: #f1f5f9;
            border-radius: 999px;
            padding: 5px 14px;
        }

        .typing .bubble { display: flex; align-items: center; gap: 5px; padding: 14px 16px; }
        .typing .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #94a3b8;
            animation: blink 1.2s infinite ease-in-out;
        }
        .typing .dot:nth-child(2) { animation-delay: .15s; }
        .typing .dot:nth-child(3) { animation-delay: .3s; }
        @keyframes blink {
            0%, 80%, 100% { opacity: .25; transform: translateY(0); }
            40% { opacity: 1; transform: translateY(-2px); }
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 0 22px 12px;
        }
        .chip {
            border: 1px solid #cbd5e1;
            background: #fff;
            color: #334155;
            font-size: 12.5px;
            padding: 7px 13px;
            border-radius: 999px;
            cursor: pointer;
            transition: all .16s ease;
        }
        .chip:hover {
            border-color: var(--brand);
            color: var(--brand);
            background: #eff6ff;
            transform: translateY(-1px);
        }

        .composer {
            border-top: 1px solid var(--line);
            padding: 14px 18px 16px;
            background: #fbfdff;
        }
        .input-row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
            background: #fff;
            border: 1px solid #cbd5e1;
            border-radius: 14px;
            padding: 8px 8px 8px 14px;
            transition: border-color .16s ease, box-shadow .16s ease;
        }
        .input-row:focus-within {
            border-color: var(--brand);
            box-shadow: 0 0 0 3px rgba(29, 78, 216, .1);
        }
        textarea {
            flex: 1;
            border: 0;
            outline: 0;
            resize: none;
            font: inherit;
            font-size: 14px;
            line-height: 1.5;
            color: var(--ink);
            background: transparent;
            max-height: 120px;
            min-height: 26px;
            padding: 4px 0;
        }
        textarea::placeholder { color: #94a3b8; }

        .send-btn {
            flex: none;
            border: 0;
            background: linear-gradient(135deg, var(--brand), #0d9488);
            color: #fff;
            font-size: 13.5px;
            font-weight: 600;
            padding: 9px 18px;
            border-radius: 10px;
            cursor: pointer;
            transition: opacity .16s ease, transform .16s ease;
        }
        .send-btn:hover:not(:disabled) { transform: translateY(-1px); }
        .send-btn:disabled { opacity: .5; cursor: not-allowed; }

        .footnote {
            margin: 8px 2px 0;
            font-size: 11px;
            color: #94a3b8;
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        @media (max-width: 640px) {
            body { padding: 0; }
            .app { height: 100vh; border-radius: 0; border: 0; max-width: none; }
            .msg { max-width: 94%; }
            .meta-badge { display: none; }
            header { padding: 14px 16px; gap: 8px; }
            .logo { width: 36px; height: 36px; border-radius: 12px; font-size: 17px; }
            .brand-prefix { display: none; }
            .title-block p { display: none; }
            .title-block h1 { font-size: 14px; white-space: nowrap; }
            .user-select { max-width: 106px; font-size: 10.5px; padding: 5px 18px 5px 8px; }
            .ghost-btn { font-size: 11px; padding: 5px 9px; }
        }
    </style>
</head>
<body>
<div class="app">
    <header>
        <div class="logo">星</div>
        <div class="title-block">
            <h1><span class="brand-prefix">星河商城 · </span>售后客服</h1>
            <p>查订单、查物流、答政策，支持一键转人工</p>
        </div>
        <select class="user-select" id="userSelect" title="切换演示用户">
            <option value="U1001">张伟（U1001）</option>
            <option value="U1002">李娜（U1002）</option>
        </select>
        <span class="meta-badge" id="metaBadge">服务连接中</span>
        <button class="ghost-btn" id="newSessionBtn">新会话</button>
    </header>

    <div class="human-banner hidden" id="humanBanner">
        <div>
            <strong>人工客服已接入</strong>
            <span class="ticket" id="humanTicket"></span>
        </div>
        <button id="endHandoffBtn">结束人工服务</button>
    </div>

    <main class="messages" id="messages" aria-live="polite"></main>

    <div class="chips" id="chips">
        <button class="chip" data-message="帮我查一下我的订单">我的订单</button>
        <button class="chip" data-message="查一下订单 ORD202610002 的物流">查物流</button>
        <button class="chip" data-message="七天无理由退货有什么条件？">退货政策</button>
        <button class="chip" data-message="我要转人工">转人工</button>
    </div>

    <div class="composer">
        <div class="input-row">
            <textarea id="input" rows="1" maxlength="1000" placeholder="请描述您的问题，例如：我的耳机想退货"></textarea>
            <button class="send-btn" id="sendBtn">发送</button>
        </div>
        <div class="footnote">
            <span>Enter 发送，Shift + Enter 换行</span>
            <span id="sessionHint"></span>
        </div>
    </div>
</div>

<script>
    const els = {
        messages: document.getElementById('messages'),
        input: document.getElementById('input'),
        sendBtn: document.getElementById('sendBtn'),
        chips: document.getElementById('chips'),
        humanBanner: document.getElementById('humanBanner'),
        humanTicket: document.getElementById('humanTicket'),
        endHandoffBtn: document.getElementById('endHandoffBtn'),
        newSessionBtn: document.getElementById('newSessionBtn'),
        userSelect: document.getElementById('userSelect'),
        metaBadge: document.getElementById('metaBadge'),
        sessionHint: document.getElementById('sessionHint')
    };

    const USERS = { U1001: '张伟', U1002: '李娜' };
    const savedUser = localStorage.getItem('xinghe.user');
    const state = {
        sessionId: localStorage.getItem('xinghe.session') || createId(),
        userId: USERS[savedUser] ? savedUser : 'U1001',
        humanMode: false,
        ticketId: null,
        busy: false
    };
    localStorage.setItem('xinghe.session', state.sessionId);
    localStorage.setItem('xinghe.user', state.userId);
    els.userSelect.value = state.userId;

    function createId() {
        if (window.crypto && crypto.randomUUID) {
            return crypto.randomUUID();
        }
        return 's-' + Date.now() + '-' + Math.random().toString(16).slice(2);
    }

    function escapeHtml(text) {
        return text
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function renderInline(text) {
        return text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    }

    function renderMarkdown(text) {
        const lines = escapeHtml(text).split('\n');
        let html = '';
        let inList = false;
        for (const line of lines) {
            const trimmed = line.trim();
            if (trimmed.startsWith('- ')) {
                if (!inList) { html += '<ul>'; inList = true; }
                html += '<li>' + renderInline(trimmed.slice(2)) + '</li>';
                continue;
            }
            if (inList) { html += '</ul>'; inList = false; }
            if (trimmed === '') {
                html += '<div class="gap"></div>';
            } else {
                html += '<p>' + renderInline(line) + '</p>';
            }
        }
        if (inList) { html += '</ul>'; }
        return html;
    }

    function scrollToBottom() {
        els.messages.scrollTop = els.messages.scrollHeight;
    }

    function appendMessage(role, text, options = {}) {
        if (role === 'notice') {
            const notice = document.createElement('div');
            notice.className = 'notice';
            notice.textContent = text;
            els.messages.appendChild(notice);
            scrollToBottom();
            return;
        }
        const row = document.createElement('div');
        row.className = 'msg ' + role + (options.error ? ' error' : '');
        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = role === 'user' ? '我' : '星';
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        if (role === 'user') {
            bubble.textContent = text;
        } else {
            bubble.innerHTML = renderMarkdown(text);
        }
        row.appendChild(avatar);
        row.appendChild(bubble);
        els.messages.appendChild(row);
        scrollToBottom();
    }

    function showTyping() {
        const row = document.createElement('div');
        row.className = 'msg assistant typing';
        row.innerHTML = '<div class="avatar">星</div><div class="bubble">' +
            '<span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
        row.id = 'typingIndicator';
        els.messages.appendChild(row);
        scrollToBottom();
        return row;
    }

    function hideTyping(row) {
        if (row && row.parentNode) { row.parentNode.removeChild(row); }
    }

    function appendWelcome() {
        const name = USERS[state.userId] || state.userId;
        appendMessage('assistant', [
            '您好，我是星河商城的售后客服小星。',
            '当前演示用户：' + name + '（' + state.userId + '）。',
            '我可以帮您：',
            '- 查询订单状态与详情',
            '- 查询物流进度',
            '- 解答退货、换货、退款、运费等售后政策',
            '',
            '需要人工协助时，直接说“转人工”即可。请告诉我您遇到的问题。'
        ].join('\n'));
    }

    function setBusy(busy) {
        state.busy = busy;
        els.sendBtn.disabled = busy;
        els.sendBtn.textContent = busy ? '发送中' : '发送';
    }

    function updateHumanMode(humanMode, ticketId) {
        state.humanMode = !!humanMode;
        state.ticketId = ticketId || null;
        els.humanBanner.classList.toggle('hidden', !state.humanMode);
        els.chips.classList.toggle('hidden', state.humanMode);
        if (state.humanMode) {
            els.humanTicket.textContent = state.ticketId ? '工单号 ' + state.ticketId : '';
            els.input.placeholder = '留言给人工客服…';
        } else {
            els.humanTicket.textContent = '';
            els.input.placeholder = '请描述您的问题，例如：我的耳机想退货';
        }
        els.sessionHint.textContent = state.sessionId ? '会话 ' + state.sessionId.slice(0, 8) : '';
    }

    async function loadMeta() {
        try {
            const response = await fetch('/api/meta');
            if (!response.ok) { throw new Error(); }
            const meta = await response.json();
            const persistence = meta.persistence === 'mysql' ? 'MySQL' : '内存';
            const providerShort = meta.provider.replace(' 本地', '').replace(' 通义千问', '');
            els.metaBadge.textContent = providerShort + ' · ' + meta.model + ' · ' + persistence;
            els.metaBadge.title = '演示用户 ' + meta.demoUserId;
        } catch (error) {
            els.metaBadge.textContent = '服务状态未知';
        }
    }

    async function syncSession() {
        try {
            const response = await fetch('/api/session?sessionId=' + encodeURIComponent(state.sessionId));
            if (!response.ok) { return; }
            const data = await response.json();
            if (data.userId && data.userId !== state.userId) {
                startNewSession();
                return;
            }
            if (data.humanMode) { updateHumanMode(true, data.ticketId); }
        } catch (error) {
            /* 首次加载时忽略，不影响对话 */
        }
    }

    async function sendMessage(rawMessage) {
        const message = (rawMessage !== undefined ? rawMessage : els.input.value).trim();
        if (!message || state.busy) { return; }
        appendMessage('user', message);
        els.input.value = '';
        autoGrow();
        setBusy(true);
        const typing = showTyping();
        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sessionId: state.sessionId, userId: state.userId, message })
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) {
                throw new Error(data.message || '服务返回异常');
            }
            if (data.sessionId && data.sessionId !== state.sessionId) {
                state.sessionId = data.sessionId;
                localStorage.setItem('xinghe.session', state.sessionId);
            }
            if (data.userId && data.userId !== state.userId) {
                state.userId = data.userId;
                localStorage.setItem('xinghe.user', state.userId);
                els.userSelect.value = state.userId;
            }
            hideTyping(typing);
            appendMessage('assistant', data.reply || '（本次没有返回内容）');
            updateHumanMode(data.humanMode, data.ticketId);
        } catch (error) {
            hideTyping(typing);
            appendMessage('assistant', '请求失败：' + error.message + '。请稍后重试。', { error: true });
        } finally {
            setBusy(false);
            els.input.focus();
        }
    }

    async function endHandoff() {
        if (state.busy) { return; }
        setBusy(true);
        try {
            const response = await fetch('/api/handoff/end', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sessionId: state.sessionId })
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) { throw new Error(data.message || '操作失败'); }
            updateHumanMode(false, null);
            appendMessage('notice', data.message || '已结束人工客服服务');
        } catch (error) {
            appendMessage('assistant', '结束人工服务失败：' + error.message, { error: true });
        } finally {
            setBusy(false);
            els.input.focus();
        }
    }

    function startNewSession() {
        state.sessionId = createId();
        localStorage.setItem('xinghe.session', state.sessionId);
        localStorage.setItem('xinghe.user', state.userId);
        els.userSelect.value = state.userId;
        els.messages.innerHTML = '';
        updateHumanMode(false, null);
        appendWelcome();
        els.input.value = '';
        autoGrow();
        els.input.focus();
    }

    function autoGrow() {
        els.input.style.height = 'auto';
        els.input.style.height = Math.min(els.input.scrollHeight, 120) + 'px';
    }

    els.sendBtn.addEventListener('click', () => sendMessage());
    els.endHandoffBtn.addEventListener('click', endHandoff);
    els.newSessionBtn.addEventListener('click', startNewSession);
    els.userSelect.addEventListener('change', () => {
        if (state.busy) {
            els.userSelect.value = state.userId;
            appendMessage('notice', '请等待当前回复完成后再切换用户。');
            return;
        }
        state.userId = els.userSelect.value;
        localStorage.setItem('xinghe.user', state.userId);
        startNewSession();
    });
    els.input.addEventListener('input', autoGrow);
    els.input.addEventListener('keydown', event => {
        if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            sendMessage();
        }
    });
    els.chips.addEventListener('click', event => {
        const chip = event.target.closest('.chip');
        if (chip) { sendMessage(chip.dataset.message); }
    });

    updateHumanMode(false, null);
    appendWelcome();
    autoGrow();
    loadMeta();
    syncSession();
</script>
</body>
</html>
